[package]
name = "wecode"
version = "0.1.0"
edition = "2024"
description = "A small, benchmark-oriented coding agent CLI"
license = "MIT"
repository = "https://github.com/alanhuangyoo/wecode"
homepage = "https://github.com/alanhuangyoo/wecode"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
directories = "6.0"
indicatif = "0.18"
codex-apply-patch-lite = { path = "third_party/codex-apply-patch" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
xai-token-estimation = { path = "third_party/xai-token-estimation" }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
